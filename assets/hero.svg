<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="sunming@github terminal: whoami, ls projects, cat motto.txt">
  <title>sunming@github — backend / tooling / automation</title>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="330" rx="16"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40H0" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".12" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset=".88" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowC" cx=".12" cy="0" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx=".95" cy="1" r=".65">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cp0" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="70" width="0" height="32">
        <animate attributeName="width" values="0;71.2" dur="0.4s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp1" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="104" width="0" height="32">
        <animate attributeName="width" values="0;356" dur="0.8s" begin="0.7s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp2" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="150" width="0" height="32">
        <animate attributeName="width" values="0;133.5" dur="0.5s" begin="1.7s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp3" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="184" width="0" height="32">
        <animate attributeName="width" values="0;480.6" dur="1s" begin="2.35s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp4" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="230" width="0" height="32">
        <animate attributeName="width" values="0;133.5" dur="0.5s" begin="3.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp5" clipPathUnits="userSpaceOnUse">
      <rect x="44" y="264" width="0" height="32">
        <animate attributeName="width" values="0;356" dur="0.8s" begin="4.15s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="330" fill="#0a0c12"/>
    <rect width="1000" height="330" fill="url(#grid)"/>
    <rect width="1000" height="330" fill="url(#glowC)"/>
    <rect width="1000" height="330" fill="url(#glowV)"/>
    <rect width="1000" height="46" fill="#0e1219"/>
    <rect y="45.5" width="1000" height="1.5" fill="url(#acc)" opacity=".9"/>
    <g fill="#ff6b6b"><circle cx="26" cy="23" r="5.5"/></g>
    <g fill="#ffd166"><circle cx="48" cy="23" r="5.5"/></g>
    <g fill="#4ade80"><circle cx="70" cy="23" r="5.5"/></g>
    <text x="94" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing=".6" fill="#7d8590">sunming@github: ~ — zsh</text>
    <text x="960" y="28" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#3f4a5a">GITHUB.COM/YYLIUCHA</text>
    <g clip-path="url(#cp0)">
      <text x="44" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="71.2" lengthAdjust="spacing" fill="#e6edf3"><tspan fill="#4ade80">$</tspan><tspan> whoami</tspan></text>
      <rect x="44" y="77" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;115.2" dur="0.4s" begin="0.2s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="0.2s"/>
        <set attributeName="opacity" to="0" begin="0.6s"/>
      </rect>
    </g>
    <g clip-path="url(#cp1)">
      <text x="44" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="356" lengthAdjust="spacing" fill="#8b949e">sunming / backend / tooling / automation</text>
      <rect x="44" y="111" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;400" dur="0.8s" begin="0.7s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="0.7s"/>
        <set attributeName="opacity" to="0" begin="1.5s"/>
      </rect>
    </g>
    <g clip-path="url(#cp2)">
      <text x="44" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="133.5" lengthAdjust="spacing" fill="#e6edf3"><tspan fill="#4ade80">$</tspan><tspan> ls ~/projects</tspan></text>
      <rect x="44" y="157" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;177.5" dur="0.5s" begin="1.7s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="1.7s"/>
        <set attributeName="opacity" to="0" begin="2.2s"/>
      </rect>
    </g>
    <g clip-path="url(#cp3)">
      <text x="44" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="480.6" lengthAdjust="spacing" fill="#8b949e">steamdeals  plugin-important-dates  pixabay-downloader</text>
      <rect x="44" y="191" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;524.6" dur="1s" begin="2.35s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="2.35s"/>
        <set attributeName="opacity" to="0" begin="3.35s"/>
      </rect>
    </g>
    <g clip-path="url(#cp4)">
      <text x="44" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="133.5" lengthAdjust="spacing" fill="#e6edf3"><tspan fill="#4ade80">$</tspan><tspan> cat motto.txt</tspan></text>
      <rect x="44" y="237" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;177.5" dur="0.5s" begin="3.5s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="3.5s"/>
        <set attributeName="opacity" to="0" begin="4s"/>
      </rect>
    </g>
    <g clip-path="url(#cp5)">
      <text x="44" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" textLength="356" lengthAdjust="spacing" fill="#8b949e">automate the boring parts, then ship it.</text>
      <rect x="44" y="271" width="9" height="19" fill="#22d3ee" opacity="0">
        <animate attributeName="x" values="44;400" dur="0.8s" begin="4.15s" fill="freeze"/>
        <set attributeName="opacity" to="1" begin="4.15s"/>
        <set attributeName="opacity" to="0" begin="4.95s"/>
      </rect>
    </g>
    <rect x="402" y="271" width="9" height="19" fill="#22d3ee" opacity="0">
      <set attributeName="opacity" to="1" begin="5.3s"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="5.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x=".5" y=".5" width="999" height="329" rx="16" fill="none" stroke="#232b3a"/>
